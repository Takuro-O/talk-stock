<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>話題ストック</title>
<style>
:root {
  --c-bg: #ffffff;
  --c-surface: #f8f9fa;
  --c-border: #eeeeee;
  --c-text: #1a1a1a;
  --c-sub: #888888;
  --c-primary: #2563eb;
  --c-primary-light: #eff6ff;
  --c-danger: #ef4444;
  --c-success: #22c55e;
  --radius-s: 8px;
  --radius-m: 12px;
  --radius-l: 20px;
  --shadow-card: 0 1px 4px rgba(0,0,0,0.07);
  --shadow-modal: 0 -4px 24px rgba(0,0,0,0.10);
  --transition: 0.18s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: var(--c-bg); color: var(--c-text);
  font-size: 16px; line-height: 1.6;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
#app {
  max-width: 430px; margin: 0 auto;
  min-height: 100dvh; display: flex; flex-direction: column;
}
button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
input, textarea, select { font-family: inherit; font-size: 16px; }
.tappable { transition: transform var(--transition), opacity var(--transition); -webkit-tap-highlight-color: transparent; }
.tappable:active { transform: scale(0.97); opacity: 0.85; }
.page { display: none; }
.page.active { display: block; }

header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--c-border);
  padding: 0 16px; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
header h1 { font-size: 18px; font-weight: 700; }

#sync-banner {
  display: none; align-items: center; gap: 6px;
  background: var(--c-primary-light); color: var(--c-primary);
  font-size: 12px; font-weight: 600; padding: 6px 16px;
}
#sync-banner.show { display: flex; }
#sync-banner.offline { background: #fff7ed; color: #c2410c; }

nav#bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
  border-top: 1px solid var(--c-border);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
}
.nav-btn {
  flex: 1; height: 56px; background: none; border: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10px; color: var(--c-sub); position: relative;
}
.nav-btn .icon { font-size: 22px; }
.nav-btn.active { color: var(--c-primary); }
.badge {
  display: none; position: absolute; top: -4px; right: -8px;
  min-width: 18px; height: 18px; background: var(--c-danger); color: #fff;
  border-radius: 9px; font-size: 11px; font-weight: 700; padding: 0 4px;
  line-height: 18px; text-align: center; border: 2px solid var(--c-bg);
}

.section-title { font-size: 13px; font-weight: 600; color: var(--c-sub); padding: 0 16px; margin-bottom: 8px; }
.card {
  background: var(--c-bg); border: 1px solid var(--c-border);
  border-radius: var(--radius-m); padding: 16px; margin: 0 16px 12px;
  box-shadow: var(--shadow-card);
}

.chip {
  display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
  border-radius: 15px; font-size: 13px; font-weight: 600; white-space: nowrap;
  background: var(--c-surface); color: var(--c-sub); margin-right: 8px;
}
.chip.active { background: var(--c-primary-light); color: var(--c-primary); }

.seg-btn {
  flex: 1; height: 34px; border: none; border-radius: 6px;
  font-size: 14px; font-weight: 600; background: transparent; color: var(--c-sub);
  transition: background var(--transition), color var(--transition), box-shadow var(--transition);
}
.seg-btn.active { background: var(--c-bg); color: var(--c-text); box-shadow: var(--shadow-card); }

.ferr { font-size: 12px; color: var(--c-danger); margin-top: 4px; }

.topic-item {
  position: relative; overflow: hidden;
  background: var(--c-bg); border: 1px solid var(--c-border);
  border-radius: var(--radius-m); margin: 0 16px 10px;
}
.topic-item-inner {
  display: flex; align-items: flex-start; gap: 10px; padding: 14px;
  background: var(--c-bg); transition: transform 0.15s ease;
}
.topic-item.done .topic-title { text-decoration: line-through; color: var(--c-sub); }
.checkbox {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--c-border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
  font-size: 14px; color: #fff;
}
.checkbox.checked { background: var(--c-success); border-color: var(--c-success); }
.topic-title { font-size: 16px; font-weight: 600; }
.topic-meta { font-size: 12px; color: var(--c-sub); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

::-webkit-scrollbar { display: none; }
.hscroll { display: flex; overflow-x: auto; padding: 0 16px 4px; }

label.field-label { display: block; font-size: 13px; font-weight: 600; color: var(--c-sub); margin-bottom: 6px; }
.input-box {
  width: 100%; padding: 0 12px; border: 1.5px solid var(--c-border);
  border-radius: var(--radius-s); outline: none; transition: border-color var(--transition);
}
input.input-box { height: 44px; }
textarea.input-box { padding: 10px 12px; min-height: 80px; resize: vertical; }
.code-box { padding: 10px 12px; font-size: 12px; font-family: 'SF Mono', 'Menlo', monospace; word-break: break-all; color: var(--c-sub); background: var(--c-surface); border-radius: var(--radius-s); }

@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid rgba(37,99,235,0.3); border-top-color: var(--c-primary);
  animation: spin 0.7s linear infinite;
}
</style>
</head>
<body>
<div id="app">

  <header>
    <h1 id="header-title">話題ストック</h1>
    <button class="tappable" onclick="showPage('settings')" style="background:none;border:none;font-size:20px;" id="header-action">⚙️</button>
  </header>

  <div id="sync-banner"><span class="spinner" id="sync-spinner"></span><span id="sync-banner-text">友達と同期中…</span></div>

  <main style="flex:1;overflow-y:auto;padding:16px 0 calc(72px + env(safe-area-inset-bottom));">

    <!-- ホーム -->
    <div id="page-home" class="page active">
      <p id="home-tagline" style="padding:0 16px 14px;font-size:12.5px;color:var(--c-sub);font-style:italic;line-height:1.6;"></p>
      <button class="tappable" onclick="openGacha()" style="display:block;width:calc(100% - 32px);margin:0 16px 16px;height:48px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:none;border-radius:var(--radius-m);font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(37,99,235,0.3);">🎰 今日のネタを引く</button>
      <div id="home-summary"></div>
      <div class="section-title">最近の未消化な話題</div>
      <div id="home-recent"></div>
    </div>

    <!-- 一覧 -->
    <div id="page-list" class="page">
      <div style="position:relative;margin:0 16px 12px;">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--c-sub);">🔍</span>
        <input id="search-input" type="search" placeholder="話題を検索" oninput="onSearch(this.value)"
          style="width:100%;height:40px;padding:0 12px 0 38px;background:var(--c-surface);border:none;border-radius:var(--radius-s);font-size:15px;outline:none;">
      </div>
      <div style="display:flex;background:var(--c-surface);border-radius:var(--radius-s);padding:3px;margin:0 16px 14px;">
        <button class="seg-btn active tappable" data-seg="all" onclick="setSegment('all')">すべて</button>
        <button class="seg-btn tappable" data-seg="todo" onclick="setSegment('todo')">未消化</button>
        <button class="seg-btn tappable" data-seg="done" onclick="setSegment('done')">話した</button>
      </div>
      <div class="hscroll" id="category-filter"></div>
      <div id="swipe-hint" style="display:none;margin:0 16px 10px;padding:8px 12px;background:var(--c-primary-light);border-radius:var(--radius-s);font-size:12px;color:var(--c-primary);align-items:center;justify-content:space-between;gap:8px;">
        <span>💡 話題を左にスワイプすると削除できます</span>
        <button class="tappable" onclick="dismissSwipeHint()" style="background:none;border:none;color:var(--c-primary);font-size:16px;line-height:1;padding:0;">✕</button>
      </div>
      <div id="list-container" style="margin-top:8px;"></div>
    </div>

    <!-- 設定 -->
    <div id="page-settings" class="page">
      <div class="section-title">共有</div>
      <div class="card">
        <p style="font-size:13px;color:var(--c-sub);line-height:1.7;margin-bottom:12px;">
          このページのURLを友達に送ってください。同じURLを開くだけで、同じリストがリアルタイムで両方の画面に反映されます（アカウント登録は不要です）。
        </p>
        <div id="share-url" class="code-box" style="margin-bottom:8px;"></div>
        <button class="tappable" onclick="copyShareUrl()" style="width:100%;height:40px;background:var(--c-surface);color:var(--c-text);border:none;border-radius:var(--radius-s);font-size:14px;font-weight:600;">URLをコピー</button>
      </div>

      <div class="section-title">カテゴリ管理</div>
      <div class="card">
        <div id="category-manage-list"></div>
        <div style="display:flex;gap:8px;margin-top:12px;margin-bottom:12px;">
          <input id="new-category-input" class="input-box" type="text" placeholder="新しいカテゴリ名" style="flex:1;">
          <button class="tappable" onclick="addCategory()" style="width:60px;height:44px;background:var(--c-primary);color:#fff;border:none;border-radius:var(--radius-s);font-size:20px;">＋</button>
        </div>
        <button class="tappable" onclick="resetCategoriesToDefault()" style="width:100%;height:40px;background:var(--c-surface);color:var(--c-text);border:none;border-radius:var(--radius-s);font-size:13px;font-weight:600;">初期の6カテゴリに入れ替える</button>
      </div>
      <div class="section-title">データ</div>
      <div class="card">
        <button class="tappable" onclick="confirmClearAll()" style="width:100%;height:48px;background:transparent;color:var(--c-danger);border:1.5px solid var(--c-danger);border-radius:var(--radius-s);font-size:16px;font-weight:600;">すべての話題を削除（全員分）</button>
      </div>
    </div>

  </main>

  <nav id="bottom-nav">
    <button class="nav-btn tappable active" data-page="home" onclick="showPage('home')">
      <span class="icon">🏠</span><span>ホーム</span>
    </button>
    <button class="nav-btn tappable" data-page="list" onclick="showPage('list')">
      <span class="icon" style="position:relative;">📋<span id="badge-list" class="badge"></span></span><span>一覧</span>
    </button>
    <button class="nav-btn tappable" data-page="settings" onclick="showPage('settings')">
      <span class="icon">⚙️</span><span>設定</span>
    </button>
  </nav>
</div>

<!-- 追加FAB -->
<button class="tappable" onclick="openAddModal();haptic()" style="position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--c-primary);color:#fff;border:none;font-size:28px;box-shadow:0 4px 16px rgba(37,99,235,0.35);z-index:90;">＋</button>

<!-- 追加/編集モーダル -->
<div id="modal" style="display:none;position:fixed;inset:0;z-index:200;align-items:flex-end;justify-content:center;">
  <div onclick="closeModal()" style="position:absolute;inset:0;background:rgba(0,0,0,0.45);"></div>
  <div style="position:relative;width:100%;max-width:430px;background:var(--c-bg);border-radius:var(--radius-l) var(--radius-l) 0 0;padding:24px 16px calc(24px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;box-shadow:var(--shadow-modal);animation:slideUp 0.25s ease;">
    <div style="width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 20px;"></div>
    <p style="font-size:16px;font-weight:700;margin-bottom:16px;" id="modal-title">話題を追加</p>

    <div style="margin-bottom:16px;">
      <label class="field-label">話題タイトル</label>
      <input id="input-title" class="input-box" type="text" maxlength="60" placeholder="例：新しく見たドラマの話">
    </div>

    <div style="margin-bottom:16px;">
      <label class="field-label">カテゴリ</label>
      <button id="select-btn" class="tappable input-box" onclick="openSelect()" style="height:44px;background:var(--c-bg);text-align:left;display:flex;align-items:center;justify-content:space-between;">
        <span id="select-label" style="color:var(--c-sub);">選択してください</span>
        <span style="color:var(--c-sub);">›</span>
      </button>
    </div>

    <button type="button" class="tappable" onclick="toggleAdvanced()" style="width:100%;text-align:left;background:none;border:none;padding:4px 0 10px;font-size:13px;color:var(--c-primary);font-weight:600;display:flex;align-items:center;justify-content:space-between;">
      <span>詳細を追加（話したい度・手応え）</span><span id="advanced-caret">▾</span>
    </button>
    <div id="modal-advanced" style="display:none;">
      <div style="margin-bottom:16px;">
        <label class="field-label">話したい度</label>
        <div id="desire-stars" style="display:flex;gap:6px;margin-bottom:6px;"></div>
        <p id="desire-comment" style="font-size:13px;color:var(--c-sub);"></p>
      </div>

      <div style="margin-bottom:16px;">
        <label class="field-label">手応え予想（任意）</label>
        <div style="display:flex;gap:8px;">
          <button type="button" class="tappable odds-btn" data-odds="safe" onclick="pickOdds('safe')" style="flex:1;height:42px;border-radius:var(--radius-s);border:1.5px solid var(--c-border);background:var(--c-bg);font-size:12.5px;font-weight:600;color:var(--c-text);">🛡 鉄板</button>
          <button type="button" class="tappable odds-btn" data-odds="gamble" onclick="pickOdds('gamble')" style="flex:1;height:42px;border-radius:var(--radius-s);border:1.5px solid var(--c-border);background:var(--c-bg);font-size:12.5px;font-weight:600;color:var(--c-text);">🎲 賭け</button>
          <button type="button" class="tappable odds-btn" data-odds="risky" onclick="pickOdds('risky')" style="flex:1;height:42px;border-radius:var(--radius-s);border:1.5px solid var(--c-border);background:var(--c-bg);font-size:12.5px;font-weight:600;color:var(--c-text);">💦 スベるかも</button>
        </div>
      </div>
    </div>

    <div style="margin-bottom:24px;">
      <label class="field-label">メモ（任意）</label>
      <textarea id="input-note" class="input-box" maxlength="300" placeholder="話したい内容や思い出したきっかけなど"></textarea>
    </div>

    <button class="tappable" id="save-btn" onclick="saveTopic()" style="width:100%;height:48px;background:var(--c-primary);color:#fff;border:none;border-radius:var(--radius-s);font-size:16px;font-weight:600;margin-bottom:10px;">保存</button>
    <button onclick="closeModal()" class="tappable" style="width:100%;height:44px;background:transparent;color:var(--c-sub);border:none;font-size:16px;">キャンセル</button>
  </div>
</div>

<!-- カテゴリ選択シート -->
<div id="select-sheet" style="display:none;position:fixed;inset:0;z-index:250;align-items:flex-end;justify-content:center;">
  <div onclick="closeSelect()" style="position:absolute;inset:0;background:rgba(0,0,0,0.45);"></div>
  <div style="position:relative;width:100%;max-width:430px;background:var(--c-bg);border-radius:var(--radius-l) var(--radius-l) 0 0;padding:24px 0 calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow-modal);animation:slideUp 0.25s ease;max-height:70dvh;overflow-y:auto;">
    <div style="width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px;"></div>
    <p style="font-size:14px;font-weight:600;color:var(--c-sub);padding:0 16px;margin-bottom:8px;">カテゴリを選択</p>
    <div id="select-options"></div>
  </div>
</div>

<!-- 初回イントロ（ちょっとウザいメッセージ） -->
<div id="intro-modal" style="display:none;position:fixed;inset:0;z-index:400;align-items:flex-end;justify-content:center;">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.5);"></div>
  <div style="position:relative;width:100%;max-width:430px;background:var(--c-bg);border-radius:var(--radius-l) var(--radius-l) 0 0;padding:28px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow-modal);animation:slideUp 0.3s ease;">
    <div style="width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 20px;"></div>
    <div style="font-size:36px;text-align:center;margin-bottom:12px;">🤫</div>
    <p style="font-size:16px;font-weight:700;text-align:center;margin-bottom:12px;">使う前に、正直な話</p>
    <p style="font-size:14.5px;color:var(--c-sub);line-height:1.8;text-align:center;margin-bottom:8px;">
      本当は、目の前の相手と<br>画面なしで盛り上がるのが一番なんです。
    </p>
    <p style="font-size:14.5px;color:var(--c-sub);line-height:1.8;text-align:center;margin-bottom:24px;">
      でも沈黙が怖い瞬間もあるので、<br>チラ見する分には許可します。
    </p>
    <button class="tappable" onclick="closeIntro('use')" style="width:100%;height:48px;background:var(--c-primary);color:#fff;border:none;border-radius:var(--radius-s);font-size:16px;font-weight:600;margin-bottom:10px;">わかってる、それでも使う</button>
    <button class="tappable" onclick="closeIntro('put_away')" style="width:100%;height:40px;background:transparent;color:var(--c-sub);border:none;font-size:13px;text-decoration:underline;">今日はスマホしまって話す</button>
  </div>
</div>

<!-- ネタガチャ -->
<div id="gacha-modal" style="display:none;position:fixed;inset:0;z-index:450;align-items:center;justify-content:center;">
  <div onclick="closeGacha()" style="position:absolute;inset:0;background:rgba(0,0,0,0.6);"></div>
  <div style="position:relative;width:86%;max-width:360px;background:var(--c-bg);border-radius:var(--radius-l);padding:28px 20px;box-shadow:var(--shadow-modal);text-align:center;">
    <div style="font-size:13px;color:var(--c-sub);font-weight:600;margin-bottom:14px;">🎰 今日のネタ抽選</div>
    <div id="gacha-display" style="font-size:19px;font-weight:700;min-height:84px;display:flex;align-items:center;justify-content:center;padding:0 8px;line-height:1.4;"></div>
    <div id="gacha-meta" style="font-size:13px;color:var(--c-sub);margin-bottom:22px;min-height:20px;"></div>
    <button class="tappable" onclick="drawGacha()" style="width:100%;height:44px;background:var(--c-surface);color:var(--c-text);border:none;border-radius:var(--radius-s);font-size:14px;font-weight:600;margin-bottom:8px;">もう一回引く</button>
    <button class="tappable" onclick="closeGacha()" style="width:100%;height:44px;background:var(--c-primary);color:#fff;border:none;border-radius:var(--radius-s);font-size:15px;font-weight:600;">これで話す</button>
  </div>
</div>

<!-- 確認ダイアログ -->
<div id="confirm-dialog" style="display:none;position:fixed;inset:0;z-index:300;align-items:flex-end;justify-content:center;">
  <div onclick="closeConfirm()" style="position:absolute;inset:0;background:rgba(0,0,0,0.45);"></div>
  <div style="position:relative;width:100%;max-width:430px;background:var(--c-bg);border-radius:var(--radius-l) var(--radius-l) 0 0;padding:24px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow-modal);animation:slideUp 0.25s ease;">
    <div style="width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px;"></div>
    <p id="confirm-title" style="font-size:16px;font-weight:700;margin-bottom:8px;"></p>
    <p id="confirm-msg" style="font-size:14px;color:var(--c-sub);margin-bottom:24px;"></p>
    <button id="confirm-ok" class="tappable" style="width:100%;height:48px;background:var(--c-danger);color:#fff;border:none;border-radius:var(--radius-s);font-size:16px;font-weight:600;margin-bottom:10px;">削除する</button>
    <button id="confirm-cancel" class="tappable" style="width:100%;height:44px;background:transparent;color:var(--c-sub);border:none;font-size:16px;">キャンセル</button>
  </div>
</div>

<!-- Firebase SDK（compat版：そのままscriptタグで使える） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ---------- Firebase 設定・初期化 ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyASR55rm-rWxVGPylIi3UuhvynITmT-zQY",
  authDomain: "talk-stock-7a4a9.firebaseapp.com",

/* ---------- 基本ユーティリティ ---------- */
const haptic = (type = 'light') => navigator.vibrate?.(type === 'heavy' ? 30 : 10);

function showToast(message, type = 'success') {
  const colors = { success: '#22c55e', error: '#ef4444', info: '#2563eb' };
  const icons  = { success: '✓', error: '✕', info: 'ℹ' };
  const t = document.createElement('div');
  t.innerHTML = `<b>${icons[type]}</b> ${message}`;
  Object.assign(t.style, {
    position:'fixed', bottom:`calc(76px + env(safe-area-inset-bottom))`,
    left:'50%', transform:'translateX(-50%) translateY(8px)',
    background:colors[type], color:'#fff', padding:'10px 18px',
    borderRadius:'20px', fontSize:'14px', fontWeight:'600',
    zIndex:'999', whiteSpace:'nowrap', boxShadow:'0 4px 16px rgba(0,0,0,0.15)',
    transition:'opacity 0.25s,transform 0.25s', opacity:'0'
  });
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
  setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 250); }, 2200);
}

function showConfirm({ title, message, label = '削除する', tone = 'danger', onOk, onCancel }) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent   = message;
  const okBtn = document.getElementById('confirm-ok');
  okBtn.textContent = label;
  okBtn.style.background = tone === 'primary' ? 'var(--c-primary)' : 'var(--c-danger)';
  okBtn.onclick = () => { onOk(); closeConfirm(); haptic('heavy'); };
  document.getElementById('confirm-cancel').onclick = () => { closeConfirm(); if (onCancel) onCancel(); };
  document.getElementById('confirm-dialog').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeConfirm() {
  document.getElementById('confirm-dialog').style.display = 'none';
  document.body.style.overflow = '';
}

/* ---------- 状態（メモリ上のキャッシュ。真実のデータはFirebase） ---------- */
const CATEGORY_COLORS = ['#2563eb','#f97316','#22c55e','#a855f7','#ef4444','#0ea5e9','#eab308','#14b8a6'];
const DEFAULT_CATEGORIES = ['真面目な話', 'エピソード', '家族の話', '昔話・思い出', 'どうでもいい話', 'カルチャー（映画・音楽・本）'];
let state = { categories: [...DEFAULT_CATEGORIES], topics: [] };

function categoryColor(cat) {
  let hash = 0;
  const str = String(cat || '');
  for (let i = 0; i < str.length; i++) { hash = (hash * 31 + str.charCodeAt(i)) >>> 0; }
  return CATEGORY_COLORS[hash % CATEGORY_COLORS.length];
}

/* ---------- Firebase 同期 ---------- */
function setSyncBanner(text, offline) {
  const el = document.getElementById('sync-banner');
  document.getElementById('sync-banner-text').textContent = text;
  document.getElementById('sync-spinner').style.display = offline ? 'none' : 'inline-block';
  el.classList.add('show');
  el.classList.toggle('offline', !!offline);
  clearTimeout(setSyncBanner._t);
  if (!offline) setSyncBanner._t = setTimeout(() => el.classList.remove('show'), 2200);
}

let _seededCategories = false;
let _syncStarted = false;
function initSync() {
  if (_syncStarted) return;
  _syncStarted = true;
  if (!fbDb) {
    setSyncBanner('データベースに接続できませんでした（この端末だけの表示です）', true);
    showPage('home');
    return;
  }
  setSyncBanner('友達と同期中…', false);

  fbDb.ref('categories').on('value', snap => {
    const val = snap.val();
    if (snap.exists() && Array.isArray(val)) {
      state.categories = val;
    } else if (!snap.exists() && !_seededCategories) {
      _seededCategories = true;
      fbDb.ref('categories').set(DEFAULT_CATEGORIES);
      state.categories = [...DEFAULT_CATEGORIES];
    }
    renderAll();
  }, err => {
    console.error(err);
    setSyncBanner('同期エラー：データベースの設定を確認してください', true);
  });

  fbDb.ref('topics').on('value', snap => {
    const val = snap.val() || {};
    state.topics = Object.entries(val)
      .map(([id, t]) => ({ id, ...t }))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderAll();
  }, err => {
    console.error(err);
    setSyncBanner('同期エラー：データベースの設定を確認してください', true);
  });
}

/* ---------- CRUD ---------- */
function addTopic(item) {
  if (!fbDb) { showToast('同期先に接続できていません', 'error'); return; }
  fbDb.ref('topics').push({ done: false, createdAt: Date.now(), ...item })
    .catch(() => showToast('追加に失敗しました', 'error'));
}
function updateTopic(id, patch) {
  if (!fbDb) return;
  fbDb.ref('topics/' + id).update(patch).catch(() => showToast('更新に失敗しました', 'error'));
}
function deleteTopic(id) {
  if (!fbDb) return;
  fbDb.ref('topics/' + id).remove().catch(() => showToast('削除に失敗しました', 'error'));
}
function toggleDone(id) {
  const t = state.topics.find(t => t.id === id);
  if (!t) return;
  updateTopic(id, { done: !t.done });
  haptic();
}
function setCategories(newList) {
  state.categories = newList;
  if (fbDb) fbDb.ref('categories').set(newList).catch(() => showToast('カテゴリの更新に失敗しました', 'error'));
  renderAll();
}

function renderCategoryFilterChips() {
  const el = document.getElementById('category-filter');
  const chips = [{ label: 'すべて', value: null }, ...state.categories.map(c => ({ label: c, value: c }))];
  el.innerHTML = chips.map(c => `
    <button class="chip tappable ${activeCategoryFilter === c.value ? 'active' : ''}" onclick="setCategoryFilter(${c.value ? `'${escapeAttr(c.value)}'` : 'null'})">${escapeHtml(c.label)}</button>
  `).join('');
}
function setCategoryFilter(val) {
  activeCategoryFilter = val;
  renderCategoryFilterChips();
  renderList();
  haptic();

function getFilteredTopics({ ignoreSegment = false } = {}) {
  let items = [...state.topics];
  if (!ignoreSegment) {
    if (currentSegment === 'todo') items = items.filter(t => !t.done);
    if (currentSegment === 'done') items = items.filter(t => t.done);
  }
  if (activeCategoryFilter) items = items.filter(t => t.category === activeCategoryFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = items.filter(t =>
      (t.title || '').toLowerCase().includes(q) ||
      (t.note || '').toLowerCase().includes(q)
    );
  }
  return items;
}

function renderList() {
  renderCategoryFilterChips();
  updateSwipeHint();
  const items = getFilteredTopics();
  const container = document.getElementById('list-container');
  if (!items.length) {
    container.innerHTML = `
      <div style="text-align:center;padding:64px 24px;color:var(--c-sub);">
        <div style="font-size:48px;margin-bottom:16px;">📭</div>
        <p style="font-size:16px;font-weight:600;color:var(--c-text);margin-bottom:8px;">該当する話題がありません</p>
        <p style="font-size:14px;">右下のボタンから追加してみましょう</p>
      </div>`;
    return;
  }
  container.innerHTML = items.map(t => topicItemHtml(t, true)).join('');
}

function setupSwipeDelegation() {
  const container = document.getElementById('list-container');
  let swipe = null;
  container.addEventListener('touchstart', e => {
    const inner = e.target.closest('.topic-item-inner');
    if (!inner) return;
    swipe = { inner, startX: e.touches[0].clientX, dx: 0 };
  }, { passive: true });
  container.addEventListener('touchmove', e => {
    if (!swipe) return;
    swipe.dx = e.touches[0].clientX - swipe.startX;
    if (swipe.dx < 0) swipe.inner.style.transform = `translateX(${Math.max(swipe.dx, -80)}px)`;
  }, { passive: true });
  container.addEventListener('touchend', () => {
    if (!swipe) return;
    const { inner, dx } = swipe;
    inner.style.transform = '';
    if (dx < -60) {
      const itemEl = inner.closest('.topic-item');
      const id = itemEl && itemEl.dataset.id;
      if (id) {
        showConfirm({
          title: '話題を削除しますか？',
          message: 'この操作は取り消せません',
          onOk: () => { deleteTopic(id); showToast('削除しました', 'success'); }
        });
      }
    }
    swipe = null;
  });
}

function topicItemHtml(t, withEdit = false) {
  return `
    <div class="topic-item ${t.done ? 'done' : ''}" data-id="${escapeAttr(t.id)}">
      <div class="topic-item-inner">
        <div class="checkbox tappable ${t.done ? 'checked' : ''}" onclick="toggleDone('${escapeAttr(t.id)}')">${t.done ? '✓' : ''}</div>
        <div style="flex:1;min-width:0;" ${withEdit ? `onclick="openEditModal('${escapeAttr(t.id)}')"` : ''}>
          <div class="topic-title">${escapeHtml(t.title)}</div>
          <div class="topic-meta">
            <span class="tag-dot" style="background:${categoryColor(t.category)};"></span>
            <span>${escapeHtml(t.category)}</span>
          </div>
          ${t.note ? `<div style="font-size:13px;color:var(--c-sub);margin-top:6px;">${escapeHtml(t.note)}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderSettings() {
  const el = document.getElementById('category-manage-list');
  if (!state.categories.length) {
    el.innerHTML = `<p style="font-size:14px;color:var(--c-sub);">カテゴリがありません</p>`;
    return;
  }
  el.innerHTML = state.categories.map(cat => {
    const count = state.topics.filter(t => t.category === cat).length;
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--c-border);">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="tag-dot" style="background:${categoryColor(cat)};"></span>
          <span style="font-size:15px;">${escapeHtml(cat)}</span>
          <span style="font-size:12px;color:var(--c-sub);">(${count}件)</span>
        </div>
        <button class="tappable" onclick="removeCategory('${escapeAttr(cat)}')" style="background:none;border:none;color:var(--c-danger);font-size:13px;font-weight:600;">削除</button>
      </div>`;
  }).join('');
}

function addCategory() {
  const input = document.getElementById('new-category-input');
  const name = input.value.trim();
  if (!name) { showToast('カテゴリ名を入力してください', 'error'); return; }
  if (state.categories.includes(name)) { showToast('既に存在するカテゴリです', 'error'); return; }
  setCategories([...state.categories, name]);
  input.value = '';
  showToast('カテゴリを追加しました');
  haptic();
}
function removeCategory(cat) {
  if (state.categories.length <= 1) {
    showToast('最後の1つは削除できません', 'error');
    return;
  }
  const count = state.topics.filter(t => t.category === cat).length;
  const fallback = state.categories.find(c => c !== cat);
  showConfirm({
    title: `「${cat}」を削除しますか？`,
    message: count > 0 ? `このカテゴリの話題 ${count} 件は「${fallback}」に移動されます` : 'この操作は取り消せません',
    onOk: () => {
      state.topics.filter(t => t.category === cat).forEach(t => updateTopic(t.id, { category: fallback }));
      setCategories(state.categories.filter(c => c !== cat));
      showToast('カテゴリを削除しました');
    }
  });
}
function resetCategoriesToDefault() {
  showConfirm({
    title: '初期の6カテゴリに入れ替えますか？',
    message: `今のカテゴリはすべて置き換わります。新しい6種類に含まれない話題は「${DEFAULT_CATEGORIES[0]}」に移動します。`,
    label: '入れ替える',
    onOk: () => {
      state.topics.forEach(t => {
        if (!DEFAULT_CATEGORIES.includes(t.category)) {
          updateTopic(t.id, { category: DEFAULT_CATEGORIES[0] });
        }
      });
      setCategories([...DEFAULT_CATEGORIES]);
      showToast('カテゴリを入れ替えました');
    }
  });
}
function confirmClearAll() {
  if (!state.topics.length) { showToast('削除する話題がありません', 'info'); return; }
  showConfirm({
    title: 'すべての話題を削除しますか？',
    message: `${state.topics.length}件の話題が全員分、完全に削除されます`,
    onOk: () => {
      if (fbDb) fbDb.ref('topics').remove().catch(() => showToast('削除に失敗しました', 'error'));
      showToast('すべて削除しました');
    }
  });
}

function openModal()  { document.getElementById('modal').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; document.body.style.overflow = ''; }

function saveTopic() {
  const titleInput = document.getElementById('input-title');
  const title = titleInput.value.trim();
  if (!title) { showError(titleInput, '話題タイトルを入力してください'); return; }
  clearError(titleInput);
  if (!modalSelectedCategory) { showToast('カテゴリを選択してください', 'error'); return; }

  const note = document.getElementById('input-note').value.trim();

  const extra = { title, category: modalSelectedCategory, note, desire: modalDesire, odds: modalOdds };
  if (editingId) {
    updateTopic(editingId, extra);
    showToast('更新しました');
  } else {
    addTopic(extra);
    showToast('追加しました');
  }
  haptic();
  closeModal();
}

function showError(input, msg) {
  input.style.borderColor = 'var(--c-danger)';
  let e = input.nextElementSibling;
  if (!e || !e.classList.contains('ferr')) {
    e = document.createElement('p');
    e.className = 'ferr';
    input.insertAdjacentElement('afterend', e);
  }
  e.textContent = msg;
}
function clearError(input) {
  input.style.borderColor = 'var(--c-border)';
  if (input.nextElementSibling && input.nextElementSibling.classList.contains('ferr')) input.nextElementSibling.remove();
}

  } else {
    container.innerHTML = state.categories.map(cat => `
      <button class="tappable" onclick="pickSelect('${escapeAttr(cat)}')" style="width:100%;height:52px;padding:0 16px;background:none;border:none;border-top:1px solid var(--c-border);font-size:16px;text-align:left;display:flex;align-items:center;justify-content:space-between;color:var(--c-text);">
        <span style="display:flex;align-items:center;gap:8px;"><span class="tag-dot" style="background:${categoryColor(cat)};"></span>${escapeHtml(cat)}</span>
        ${modalSelectedCategory === cat ? '<span style="color:var(--c-primary);">✓</span>' : ''}
      </button>`).join('');
  }
  document.getElementById('select-sheet').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function pickSelect(cat) {
  modalSelectedCategory = cat;
  updateSelectLabel();
  closeSelect();
  haptic();
}
function closeSelect() {
  document.getElementById('select-sheet').style.display = 'none';
  document.body.style.overflow = '';
}

/* ---------- ネタガチャ ---------- */
const ODDS_LABELS = { safe: '🛡 鉄板', gamble: '🎲 賭け', risky: '💦 スベるかも' };
let gachaSpinTimer = null;

function gachaPool() {
  return getFilteredTopics({ ignoreSegment: true }).filter(t => !t.done);
}
function openGacha() {
  const pool = gachaPool();
  if (!pool.length) { showToast('引ける話題がありません（絞り込みを確認してください）', 'info'); return; }
  document.getElementById('gacha-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  drawGacha();
}
function closeGacha() {
  clearInterval(gachaSpinTimer);
  document.getElementById('gacha-modal').style.display = 'none';
  document.body.style.overflow = '';
}
function drawGacha() {
  const pool = gachaPool();
  if (!pool.length) { showToast('引ける話題がありません', 'info'); closeGacha(); return; }
  clearInterval(gachaSpinTimer);
  const display = document.getElementById('gacha-display');
  const meta = document.getElementById('gacha-meta');
  meta.textContent = '';
  haptic();
  let ticks = 0;
  const maxTicks = 14;
  gachaSpinTimer = setInterval(() => {
    const r = pool[Math.floor(Math.random() * pool.length)];
    display.textContent = r.title;
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(gachaSpinTimer);
      const result = pool[Math.floor(Math.random() * pool.length)];
      display.textContent = result.title;
      const stars = result.desire ? '★'.repeat(result.desire) + '☆'.repeat(5 - result.desire) : '';
      meta.textContent = [stars, result.category, result.odds ? ODDS_LABELS[result.odds] : ''].filter(Boolean).join(' ・ ');
      haptic('heavy');
    }
  }, 70);
}

/* ---------- ちょっとウィットに富んだ小ネタ機能（この端末だけの表示設定） ---------- */
const INTRO_KEY  = 'topicStock_seenIntro_v1';
const VISIT_KEY  = 'topicStock_visits_v1';

const TAGLINES = [
  '本当に盛り上がる話は、だいたいリストにない話から始まります。',
  'チラ見して、すぐしまうのが正しい使い方です。',
  '相手にガン見されてると気づいたら、そっと閉じましょう。',
  '沈黙が気まずくなったときだけ、こっそり開いてください。',
  'ネタ帳を見せびらかすと、若干冷めるので内緒で。',
  '一番いい使い方は「見た瞬間に閉じて忘れる」ことです。',
  'このリストより、相手の顔を見てる時間の方が長くなりますように。',
  '話が弾みすぎて、結局一つもチェックしないのが理想です。',
];
const MILESTONES = {
  5:   '5回目のチラ見です。もう十分ネタは頭に入ってるかも？',
  10:  '10回開いてます。そろそろリストより会話に集中してみては。',
  30:  '30回目…もはや暗記してませんか？画面より相手を見ましょう。',
  50:  '50回目、お疲れさまです。今日はしまって話してみては。',
};

function setHomeTagline(visits) {
  const el = document.getElementById('home-tagline');
  if (!el) return;
  el.textContent = TAGLINES[visits % TAGLINES.length];
}
function maybeShowMilestone(visits) {
  if (MILESTONES[visits]) setTimeout(() => showToast(MILESTONES[visits], 'info'), 900);
}
function showIntroModal() {
  document.getElementById('intro-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeIntro(choice) {
  document.getElementById('intro-modal').style.display = 'none';
  document.body.style.overflow = '';
  try { localStorage.setItem(INTRO_KEY, '1'); } catch {}
  haptic();
  if (choice === 'put_away') {
    showToast('えらい。今日はこのアプリの出番なしですね。', 'success');
  }
}
function trackVisitAndIntro() {
  let visits = 1;
  try {
    visits = parseInt(localStorage.getItem(VISIT_KEY) || '0', 10) + 1;
    localStorage.setItem(VISIT_KEY, String(visits));
  } catch {}
  setHomeTagline(visits);
  let seenIntro = true;
  try { seenIntro = localStorage.getItem(INTRO_KEY) === '1'; } catch {}
  if (!seenIntro) showIntroModal();
  else maybeShowMilestone(visits);
}

function migrateLegacyLocalData() {
  const LEGACY_KEY = 'topicStock_v1';
  const MIGRATED_KEY = 'topicStock_migratedLegacy_v1';
  if (!fbDb) return;
  let alreadyPrompted = false;
  try { alreadyPrompted = localStorage.getItem(MIGRATED_KEY) === '1'; } catch {}
  if (alreadyPrompted) return;

  let legacy = null;
  try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)); } catch {}
  if (!legacy || !Array.isArray(legacy.topics) || !legacy.topics.length) {
    try { localStorage.setItem(MIGRATED_KEY, '1'); } catch {}
    return;
  }

  // 二度と聞かれないよう、表示した時点で「対応済み」にする（受諾・拒否のどちらでも再表示しない）
  try { localStorage.setItem(MIGRATED_KEY, '1'); } catch {}

  showConfirm({
    title: '前のバージョンの話題が残っています',
    message: `この端末に${legacy.topics.length}件、共有前の話題が残っています。今の共有リストに追加しますか？`,
    label: '取り込む',
    tone: 'primary',
    onOk: () => {
      legacy.topics.forEach(t => {
        if (!t || !t.title) return;
        fbDb.ref('topics').push({
          title: t.title,
          category: (legacy.categories || []).includes(t.category) ? t.category : DEFAULT_CATEGORIES[0],
          note: t.note || '',
          done: !!t.done,
          desire: t.desire || null,
          odds: t.odds || null,
          createdAt: t.createdAt || Date.now(),
        }).catch(() => {});
      });
      try { localStorage.removeItem(LEGACY_KEY); } catch {}
      showToast(`${legacy.topics.length}件を取り込みました`);
    }
  });
}

/* ---------- ヘルパー ---------- */
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str).replace(/'/g, '&#39;'); }

/* ---------- 初期化 ---------- */
renderAll();
setupSwipeDelegation();
trackVisitAndIntro();
initSync();
migrateLegacyLocalData();
</script>
</body>
